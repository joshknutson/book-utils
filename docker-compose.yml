services:
  book-utils:
    build: .
    container_name: book-utils
    environment:
      - DRY_RUN=false #don't change anything
      - CONVERT_TIME=02:00      # Fills gaps from AZW3/MOBI
      - VALIDATE_TIME=04:00     # Checks EPUB health and auto-fixes
      - SKIP_CONVERSION=false
      - SKIP_VALIDATION=false
      - TZ=America/Chicago
    volumes:
      - /data/media/books:/books
      - /etc/localtime:/etc/localtime:ro
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '.5'  # Prevent conversion from pinning all Thor's CPU cores
          memory: 1G
